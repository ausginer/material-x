# Coverage is diagnostic (`repo:RD-6` property 7): Codecov reports it and never
# blocks a merge. Vitest's `coverage.include` limits the report to the packages'
# source; the ignore list repeats that for anything outside it.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

ignore:
  - '.scripts/**'
  - '.storybook/**'
  - 'node_modules/**'
  - 'packages/*/tests/**'
  - 'packages/*/bench/**'
  - 'packages/*/.vite/**'
  - 'packages/*/.data/**'
