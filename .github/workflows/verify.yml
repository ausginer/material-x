# The repository's verification: formatting, lint and types, the test suite in
# Chromium, Firefox and Playwright's WebKit, on Linux and headless, and the docs
# site, built and loaded in Chromium. Real Safari runs outside the gate, in
# `safari.yml`, weekly and on demand (`repo:RD-12`).
# `verify` is the one check the branch rule requires (`repo:RD-6`). `deploy`
# publishes the docs build to GitHub Pages from `main` only (`repo:RD-14`).
# `measurements` reports sizes and allocations and never fails the run
# (`repo:RD-7`). `scope` makes a run whose head commit carries `[noci]`, and
# whose changes since the last fully verified commit are records or Markdown,
# a reduced one, in which only `records` runs (`repo:RD-15`). `system-deps`
# fetches the engines' system packages before any test job starts, and each job
# that launches a browser installs them offline from the cache (`repo:RD-21`).
name: verify

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

# A newer run for the same pull request cancels the older one. A run for a push
# to `main` has its own group and is never cancelled.
concurrency:
  group: verify-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: 26
  # The aube that `package.json`'s `packageManager` names. Each job installs it
  # with npm's one command, outside the checkout, so that npm doesn't read the
  # repository's `.npmrc` (`repo:RD-16` property 9).
  AUBE_VERSION: 2.10.0

# Each job's timeout-minutes is about twice its longest run observed on pull
# request #27 (`.plan/ci-verification-1/ci-verification-report.md`), and
# `docs`'s on its first runs (`.plan/docs-gate-1/docs-gate-report.md`).
jobs:
  # Decides the run's mode (`repo:RD-15`). `reduced` only if the head commit
  # carries `[noci]` and every change since the last fully verified commit is a
  # record or Markdown; otherwise `full`. It installs nothing: the decision
  # script uses Node's built-in modules, `git` and `gh`.
  scope:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node .scripts/ci-scope.ts

  # A reduced run's checks: the gate's checks that read records and Markdown.
  # `oxfmt` formats both, the record resolver's tests resolve entries in the
  # real records, and drag's `tsconfig.json` includes a probe under its `.plan/`.
  records:
    needs: scope
    if: github.event.pull_request.draft != true && needs.scope.outputs.mode == 'reduced'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # The record resolver's `repo` tests read retired scopes from history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install aube
        id: aube
        working-directory: ${{ runner.temp }}
        run: |
          npm install -g "@endevco/aube@$AUBE_VERSION"
          echo "store=$(aube store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.aube.outputs.store }}
          key: aube-${{ runner.os }}-${{ env.AUBE_VERSION }}-${{ hashFiles('package-lock.json') }}
      - run: aube ci
      - run: aube exec just fmt-check
      - run: aube exec just typecheck
      # Through the root `test` recipe, which builds what the Vitest config
      # loads, as in every other gate job.
      - run: aube exec -- just test --project repo .scripts/entry.node.test.ts

  # Fetches each engine's system packages once per cache key, before any test
  # job starts, and installs nothing (`repo:RD-21` property 1). Playwright
  # still chooses the packages: apt runs its `install-deps` in download-only
  # mode, so it downloads what Playwright's install would on this image. A hit
  # ends after the lookup. Each leg saves its own engine, so a re-run after a
  # timeout doesn't fetch that engine again. A set that the image already has
  # saves an empty directory, which `actions/cache` stores, and the test jobs
  # read it as a hit. The limit covers WebKit's 125 MB from a slow mirror. When
  # every test job's restore hits, it is the only place a slow mirror can fail
  # a run. A test job whose own restore misses falls back to the mirror, and on
  # a slow one it can time out (`repo:RD-21` property 4).
  system-deps:
    needs: scope
    if: github.event.pull_request.draft != true && needs.scope.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: key
        env:
          ENGINE: ${{ matrix.engine }}
        run: .github/actions/browser/key.sh "$ENGINE"
      - id: lookup
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.key.outputs.dir }}
          key: ${{ steps.key.outputs.key }}
          lookup-only: true
      - if: steps.lookup.outputs.cache-hit != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - if: steps.lookup.outputs.cache-hit != 'true'
        name: Install aube
        id: aube
        working-directory: ${{ runner.temp }}
        run: |
          npm install -g "@endevco/aube@$AUBE_VERSION"
          echo "store=$(aube store path)" >> "$GITHUB_OUTPUT"
      - if: steps.lookup.outputs.cache-hit != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.aube.outputs.store }}
          key: aube-${{ runner.os }}-${{ env.AUBE_VERSION }}-${{ hashFiles('package-lock.json') }}
      - if: steps.lookup.outputs.cache-hit != 'true'
        run: aube ci
      # apt reads the configuration as root, under Playwright's sudo, and
      # leaves its lock and partial downloads beside the archives.
      - if: steps.lookup.outputs.cache-hit != 'true'
        name: Download the system packages
        env:
          ENGINE: ${{ matrix.engine }}
          DIR: ${{ steps.key.outputs.dir }}
        run: |
          echo "ImageOS: $ImageOS, ImageVersion: $ImageVersion"
          mkdir -p "${DIR:?}/partial"
          printf 'APT::Get::Download-Only "true";\nDir::Cache::archives "%s/";\n' "$DIR" |
            sudo tee /etc/apt/apt.conf.d/99-system-deps
          aube exec -- playwright install-deps "$ENGINE"
          sudo rm -rf /etc/apt/apt.conf.d/99-system-deps "${DIR:?}/partial" "${DIR:?}/lock"
          sudo chown -R "$(id -un)" "$DIR"
          echo "$(find "$DIR" -name '*.deb' | wc -l) archives, $(du -sh "$DIR" | cut -f1)"
      - if: steps.lookup.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.key.outputs.dir }}
          key: ${{ steps.key.outputs.key }}

  static:
    needs: scope
    if: github.event.pull_request.draft != true && needs.scope.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install aube
        id: aube
        working-directory: ${{ runner.temp }}
        run: |
          npm install -g "@endevco/aube@$AUBE_VERSION"
          echo "store=$(aube store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.aube.outputs.store }}
          key: aube-${{ runner.os }}-${{ env.AUBE_VERSION }}-${{ hashFiles('package-lock.json') }}
      - run: aube ci
      - run: aube exec just fmt-check
      - run: aube exec just lint
      - run: aube exec just typecheck
      - run: aube exec just typecheck-declarations

  chromium:
    needs: [scope, system-deps]
    if: github.event.pull_request.draft != true && needs.scope.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # The record resolver's `repo` tests read retired scopes from history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install aube
        id: aube
        working-directory: ${{ runner.temp }}
        run: |
          npm install -g "@endevco/aube@$AUBE_VERSION"
          echo "store=$(aube store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.aube.outputs.store }}
          key: aube-${{ runner.os }}-${{ env.AUBE_VERSION }}-${{ hashFiles('package-lock.json') }}
      - run: aube ci
      - uses: ./.github/actions/browser
        with:
          engine: chromium
      # Diagnostics for the visual rows (`repo:RD-13` property 9). Nothing
      # compares them.
      - name: Runner image and processor
        run: |
          echo "ImageOS: $ImageOS, ImageVersion: $ImageVersion"
          lscpu | grep 'Model name'
      # Every project, visual included, without measurement rows, with coverage.
      # Vitest's default reporters under GitHub Actions, and its exit status.
      - run: aube exec -- just test --coverage --tags-filter '!measurement'
        env:
          MX_TEST_VISUAL: '1'
      # Every run uploads, including one whose tests failed.
      - if: '!cancelled()'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: .coverage/lcov.info
          disable_search: true
          fail_ci_if_error: true
      # CI never writes a baseline. A failed comparison's actual and diff
      # images are kept for review.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: .vitest/attachments
          if-no-files-found: ignore

  firefox:
    needs: [scope, system-deps]
    if: github.event.pull_request.draft != true && needs.scope.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install aube
        id: aube
        working-directory: ${{ runner.temp }}
        run: |
          npm install -g "@endevco/aube@$AUBE_VERSION"
          echo "store=$(aube store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.aube.outputs.store }}
          key: aube-${{ runner.os }}-${{ env.AUBE_VERSION }}-${{ hashFiles('package-lock.json') }}
      - run: aube ci
      - uses: ./.github/actions/browser
        with:
          engine: firefox
      - run: aube exec -- just test --project '*/firefox' --tags-filter '!measurement'
        env:
          MX_TEST_ENGINES: firefox

  # Playwright's WebKit build, headless on Linux, through the provider and the
  # commands Chromium and Firefox use (`repo:RD-12` property 11).
  webkit:
    needs: [scope, system-deps]
    if: github.event.pull_request.draft != true && needs.scope.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install aube
        id: aube
        working-directory: ${{ runner.temp }}
        run: |
          npm install -g "@endevco/aube@$AUBE_VERSION"
          echo "store=$(aube store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.aube.outputs.store }}
          key: aube-${{ runner.os }}-${{ env.AUBE_VERSION }}-${{ hashFiles('package-lock.json') }}
      - run: aube ci
      - uses: ./.github/actions/browser
        with:
          engine: webkit
      - run: aube exec -- just test --project '*/webkit' --tags-filter '!measurement'
        env:
          MX_TEST_ENGINES: webkit

  # Builds the docs site and loads every page of it (`repo:RD-14`). On `main`,
  # its artifact is what `deploy` publishes.
  docs:
    needs: [scope, system-deps]
    if: github.event.pull_request.draft != true && needs.scope.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install aube
        id: aube
        working-directory: ${{ runner.temp }}
        run: |
          npm install -g "@endevco/aube@$AUBE_VERSION"
          echo "store=$(aube store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.aube.outputs.store }}
          key: aube-${{ runner.os }}-${{ env.AUBE_VERSION }}-${{ hashFiles('package-lock.json') }}
      - run: aube ci
      - uses: ./.github/actions/browser
        with:
          engine: chromium
      - run: aube exec just docs-build
      - run: aube exec just docs-smoke
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .docs

  # Succeeds only if `scope` succeeded, every job of its mode succeeded, and
  # every job outside the mode was skipped (`repo:RD-15` property 5). A
  # cancelled or failed job fails it in either mode.
  verify:
    if: always() && github.event.pull_request.draft != true
    needs:
      [scope, records, system-deps, static, chromium, firefox, webkit, docs]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
          MODE: ${{ needs.scope.outputs.mode }}
        run: |
          failed=0
          expect() {
            result="$(jq -r --arg job "$1" '.[$job].result' <<< "$NEEDS")"
            echo "$1: $result, expected $2"
            [ "$result" = "$2" ] || failed=1
          }
          expect scope success
          case "$MODE" in
            full)
              for job in system-deps static chromium firefox webkit docs; do expect "$job" success; done
              expect records skipped
              ;;
            reduced)
              expect records success
              for job in system-deps static chromium firefox webkit docs; do expect "$job" skipped; done
              ;;
            *)
              echo "scope named no mode: '$MODE'"
              failed=1
              ;;
          esac
          exit "$failed"

  # Holds the Pages token, and runs only for `main`. Outside the gate: it needs
  # only `docs`, so a failure elsewhere doesn't hold the docs back. Deployments
  # run one at a time, and each waits rather than being cancelled.
  deploy:
    needs: docs
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Outside the gate: `verify` doesn't need it, and nothing in it fails the run.
  measurements:
    needs: [scope, system-deps]
    if: github.event.pull_request.draft != true && needs.scope.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install aube
        id: aube
        working-directory: ${{ runner.temp }}
        run: |
          npm install -g "@endevco/aube@$AUBE_VERSION"
          echo "store=$(aube store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.aube.outputs.store }}
          key: aube-${{ runner.os }}-${{ env.AUBE_VERSION }}-${{ hashFiles('package-lock.json') }}
      - run: aube ci
      - uses: ./.github/actions/browser
        with:
          engine: chromium
      # A failing row is reported, not a failed step. A declaration project
      # type-checks its files and has no tags, so it is not selected.
      - name: Measurement rows
        run: >-
          aube exec -- just test --tags-filter measurement --project '!declaration*' --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/measurements.json" || true
      - name: Sizes at the head
        run: aube exec just size-reading "$RUNNER_TEMP/head-size.json"
      # A push to `main` keeps its reading, for the pull requests whose merge
      # base is this commit. The retention is the repository's.
      - name: Store the reading
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: size-reading
          path: ${{ runner.temp }}/head-size.json
      # The reading that `main`'s push run stored for the merge base. Nothing
      # is built. No push run, or no unexpired `size-reading` artifact in its
      # list, is a missing reading, which sets `missing`. A call that fails is
      # a failed lookup: it sets nothing and leaves no file. Exit statuses and
      # the API's JSON tell them apart, never gh's error text.
      - name: Sizes at the merge base
        id: base
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          failed() {
            echo "::warning title=Measurement::The lookup of main's size reading for the merge base failed"
            exit 0
          }
          missing() {
            echo "missing=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Measurement::$1"
            exit 0
          }
          api="repos/$GITHUB_REPOSITORY/actions"
          base="$(git merge-base HEAD "origin/$BASE_REF")" || failed
          echo "merge base: $base"
          run="$(gh api "$api/workflows/verify.yml/runs?event=push&branch=main&head_sha=$base" \
            --jq '.workflow_runs[0].id // empty')" || failed
          [ -n "$run" ] || missing "main has no push run for the merge base $base, so no size reading is stored"
          artifact="$(gh api "$api/runs/$run/artifacts?name=size-reading" \
            --jq '[.artifacts[] | select(.expired | not)][0].id // empty')" || failed
          [ -n "$artifact" ] || missing "main's run $run for the merge base $base stored no size reading"
          gh run download "$run" --repo "$GITHUB_REPOSITORY" \
            --name size-reading --dir "$RUNNER_TEMP/base-reading" || failed
          echo "base reading: run $run, artifact $artifact"
      # A pull request's report reads the downloaded file, or states that none
      # is stored. A push or a manual run looks up no base and passes neither.
      - name: Report
        env:
          EVENT: ${{ github.event_name }}
          MISSING: ${{ steps.base.outputs.missing }}
        run: |
          base=()
          if [ "$EVENT" = pull_request ]; then
            base=(--base "$RUNNER_TEMP/base-reading/head-size.json")
            if [ "$MISSING" = true ]; then
              base+=(--base-missing)
            fi
          fi
          aube exec -- just size-report --head "$RUNNER_TEMP/head-size.json" \
            "${base[@]}" \
            --tests "$RUNNER_TEMP/measurements.json" \
            --out "$RUNNER_TEMP/size-report.md"
          cat "$RUNNER_TEMP/size-report.md" >> "$GITHUB_STEP_SUMMARY"
      # The only step that writes to the pull request. A fork's token can't.
      - name: Comment
        if: >-
          github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          id="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments" \
            --jq '.[] | select(.body | startswith("<!-- mx-size-report -->")) | .id' | head -n 1)"
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" \
              -F "body=@$RUNNER_TEMP/size-report.md" > /dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments" \
              -F "body=@$RUNNER_TEMP/size-report.md" > /dev/null
          fi
