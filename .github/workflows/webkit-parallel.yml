# TEMPORARY witness for the CI-speed handoff's item 1 witness 5, removed in the
# next commit that removes the other temporaries. Three consecutive runs of the
# WebKit job's test step, each beside a serial run, in alternating order. The
# parallel step sets MX_WITNESS_WEBKIT_PARALLEL, which `.scripts/vitest-config.ts`
# reads only while this witness is on the branch.
name: webkit-parallel

on:
  push:
    branches: [repo/ci-speed-1]
    paths: [.github/workflows/webkit-parallel.yml]

permissions:
  contents: read

env:
  NODE_VERSION: 26
  AUBE_VERSION: 2.10.0

jobs:
  run:
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          - run: 1
            order: serial-first
          - run: 2
            order: parallel-first
          - run: 3
            order: serial-first
    name: run ${{ matrix.run }} (${{ matrix.order }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install aube
        id: aube
        working-directory: ${{ runner.temp }}
        run: |
          npm install -g "@endevco/aube@$AUBE_VERSION"
          echo "store=$(aube store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.aube.outputs.store }}
          key: aube-${{ runner.os }}-${{ env.AUBE_VERSION }}-${{ hashFiles('package-lock.json') }}
      - run: aube ci
      - run: aube exec -- playwright install --with-deps webkit
      - name: serial
        if: matrix.order == 'serial-first'
        continue-on-error: true
        run: aube exec -- just test --project '*/webkit' --tags-filter '!measurement'
        env:
          MX_TEST_ENGINES: webkit
      - name: parallel
        continue-on-error: true
        run: aube exec -- just test --project '*/webkit' --tags-filter '!measurement'
        env:
          MX_TEST_ENGINES: webkit
          MX_WITNESS_WEBKIT_PARALLEL: '1'
      - name: serial
        if: matrix.order == 'parallel-first'
        continue-on-error: true
        run: aube exec -- just test --project '*/webkit' --tags-filter '!measurement'
        env:
          MX_TEST_ENGINES: webkit
