# A review's mutation file, run by `@ydinjs/mutator` in each engine, on the
# reviewer's dispatch alone (`repo:RD-65` property 7). Nothing runs it on a push
# or a pull request, and it gates nothing.
#
# The runner, the config and the mutation file come from the ref the workflow
# is dispatched on, and the code under test from the `ref` input, so an older
# commit runs too, and it doesn't have to hold the file (`repo:RD-66` property
# 1). Each leg checks out `ref` at the workspace's root, and the runner in
# `.mutator/`, sparsely: the command line's source, the config, the browser
# action and the file, with no manifest, so no workspace tool takes it for a
# project. The tool applies the mutations in a worktree of `ref` that it
# creates, as a local run does, and never writes to the checkout. The engines
# are the builds that `ref`'s lockfile pins, installed by `verify`'s browser
# action.
#
# `plan` refuses a file with a stale edit before any leg runs a test. Each leg
# runs the unmutated files and then its share of the mutations, one at a time,
# and uploads its JSON report. `summary` names the two commits, compares the
# engines and fails on any outcome other than _as expected_ and on any mutation
# that differs between engines. A leg that refuses the file in its engine fails
# the summary, which names it, and running it again refuses it again. A leg
# that fails for another reason outside the tests, such as a browser that
# doesn't start, fails the summary too; run it again.
name: mutations

on:
  workflow_dispatch:
    inputs:
      ref:
        description: The commit whose code the mutations run on. It doesn't have to hold the mutation file.
        required: true
      file:
        description: The mutation file's path in the ref that the workflow is dispatched on.
        required: true
      shards:
        description: How many legs each engine is split into, a positive integer.
        required: false
        default: '1'

# One run per commit and file at a time. A newer run waits, and none is
# cancelled.
concurrency:
  group: mutations-${{ inputs.ref }}-${{ inputs.file }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: 26
  # The aube that `package.json`'s `packageManager` names, installed with npm's
  # one command outside the checkout (`repo:RD-16` property 9).
  AUBE_VERSION: 2.10.0
  # What the runner checks out of its own ref: the tool, the config, the
  # browser action and the mutation file.
  RUNNER_FILES: |
    packages/mutator/src/
    mutator.config.ts
    .github/actions/browser/
    ${{ inputs.file }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.check.outputs.commit }}
      legs: ${{ steps.legs.outputs.legs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .mutator
          sparse-checkout: ${{ env.RUNNER_FILES }}
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Exits with 2, naming each stale edit, before any leg starts.
      - id: check
        env:
          FILE: ${{ inputs.file }}
        run: |
          checked="$(node .mutator/packages/mutator/src/cli.ts check ".mutator/$FILE")"
          echo "$checked"
          echo "commit=$(node -p 'JSON.parse(process.argv[1]).commit' "$checked")" >> "$GITHUB_OUTPUT"
          echo "checked=$checked" >> "$GITHUB_OUTPUT"
      - id: legs
        env:
          CHECKED: ${{ steps.check.outputs.checked }}
          SHARDS: ${{ inputs.shards }}
        run: |
          node -e '
            const { engines } = JSON.parse(process.env.CHECKED);
            const count = Number(process.env.SHARDS);
            const legs = engines.flatMap((engine) =>
              Array.from({ length: count }, (_, at) => ({ engine, shard: at + 1, count })),
            );
            console.log(`legs=${JSON.stringify(legs)}`);
          ' >> "$GITHUB_OUTPUT"

  leg:
    needs: plan
    name: ${{ matrix.engine }} ${{ matrix.shard }}/${{ matrix.count }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.legs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .mutator
          sparse-checkout: ${{ env.RUNNER_FILES }}
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install aube
        id: aube
        working-directory: ${{ runner.temp }}
        run: |
          npm install -g "@endevco/aube@$AUBE_VERSION"
          echo "store=$(aube store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.aube.outputs.store }}
          key: aube-${{ runner.os }}-${{ env.AUBE_VERSION }}-${{ hashFiles('package-lock.json') }}
      # The browser action runs Playwright from the lockfile. The config's setup
      # installs again, which then changes nothing.
      - run: aube ci
      - uses: ./.mutator/.github/actions/browser
        with:
          engine: ${{ matrix.engine }}
      # Exit 1 is a completed run whose outcomes `summary` judges. Exit 2 is a
      # file that this engine refuses, which the leg records for `summary`.
      - env:
          FILE: ${{ inputs.file }}
          COMMIT: ${{ needs.plan.outputs.commit }}
          ENGINE: ${{ matrix.engine }}
          SHARD: ${{ matrix.shard }}/${{ matrix.count }}
        run: |
          status=0
          node .mutator/packages/mutator/src/cli.ts run ".mutator/$FILE" \
            --ref "$COMMIT" --engine "$ENGINE" --shard "$SHARD" \
            --config .mutator/mutator.config.ts --report "$RUNNER_TEMP/leg.json" \
            || status=$?
          if [ "$status" -eq 2 ]; then
            echo "$ENGINE $SHARD" > "$RUNNER_TEMP/refused.txt"
          fi
          [ "$status" -le 1 ]
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: leg-${{ matrix.engine }}-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/leg.json
            ${{ runner.temp }}/refused.txt
          if-no-files-found: ignore

  summary:
    needs: [plan, leg]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .mutator
          sparse-checkout: ${{ env.RUNNER_FILES }}
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: leg-*
          path: legs
      - env:
          LEGS: ${{ needs.leg.result }}
          PLANNED: ${{ needs.plan.outputs.legs }}
        run: |
          shopt -s nullglob
          reports=(legs/*/leg.json)
          refused=(legs/*/refused.txt)
          status=0
          node .mutator/packages/mutator/src/cli.ts summary "${reports[@]}" --out summary.md || status=$?
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
          for leg in "${refused[@]}"; do
            echo "The leg $(cat "$leg") refused the file before any mutation: its log names each reason, and running it again refuses it again." | tee -a "$GITHUB_STEP_SUMMARY"
            status=1
          done
          planned="$(node -p 'JSON.parse(process.argv[1]).length' "$PLANNED")"
          if [ "$LEGS" != 'success' ] && [ $(( ${#reports[@]} + ${#refused[@]} )) -lt "$planned" ]; then
            echo "A leg ended with $LEGS, outside the tests: run it again." | tee -a "$GITHUB_STEP_SUMMARY"
            status=1
          fi
          exit "$status"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: summary
          path: |
            summary.md
            legs/
