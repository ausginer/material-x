# Records the visual baselines on GitHub's runner, where the gate compares them,
# and proposes each added or changed one in a pull request for the owner's
# review (`repo:RD-13`). The gate never writes a baseline, and this workflow
# writes them only to its `baselines/<target>` branch.
name: baselines

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

env:
  NODE_VERSION: 26
  # The aube that `package.json`'s `packageManager` names. Each job installs it
  # with npm's one command, outside the checkout, so that npm doesn't read the
  # repository's `.npmrc` (`repo:RD-16` property 9).
  AUBE_VERSION: 2.10.0
  # The branch whose head is recorded: the dispatched branch, or the pull
  # request's head branch.
  TARGET: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

# One recording per target, and a newer one cancels the older one. GitHub reads
# this group when it queues a run, before any job's `if`, so the condition is
# `record`'s own: a run that it doesn't admit, such as another label or a
# fork's pull request, gets a group of its own and cancels nothing.
concurrency:
  group: >-
    ${{ (github.event_name == 'workflow_dispatch' || (github.event.label.name == 'record-baselines' && github.event.pull_request.head.repo.full_name == github.repository)) && format('baselines-{0}', github.event_name == 'pull_request' && github.head_ref || github.ref_name) || format('baselines-unadmitted-{0}', github.run_id) }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Runs the repository's code, with a read-only token.
  record:
    if: >-
      github.event_name == 'workflow_dispatch' || (github.event.label.name == 'record-baselines' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Refuse a proposal branch as the target
        run: |
          case "$TARGET" in
            baselines/*) echo "::error::$TARGET is a proposal branch"; exit 1 ;;
          esac
      # A pull request's head commit, never its merge commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install aube
        id: aube
        working-directory: ${{ runner.temp }}
        run: |
          npm install -g "@endevco/aube@$AUBE_VERSION"
          echo "store=$(aube store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.aube.outputs.store }}
          key: aube-${{ runner.os }}-${{ env.AUBE_VERSION }}-${{ hashFiles('package-lock.json') }}
      - run: aube ci
      - uses: ./.github/actions/browser
        with:
          engine: chromium
      - name: Runner image, processor and Chromium
        run: |
          {
            echo "image=$ImageOS $ImageVersion"
            echo "processor=$(lscpu | sed -n 's/^Model name: *//p')"
            echo "chromium=$(node -e "require('playwright').chromium.launch({ channel: 'chromium' }).then(async (b) => { console.log(b.version()); await b.close(); })")"
          } | tee "$RUNNER_TEMP/environment.txt"
      # The update flag rewrites a baseline only where its comparison failed or
      # it didn't exist; one that still matches stays as it is.
      - run: aube exec -- just test --project visual/material-x --update
        env:
          MX_TEST_VISUAL: '1'
      - name: Collect the added and changed baselines
        run: |
          mkdir -p "$RUNNER_TEMP/proposal"
          git status --porcelain --untracked-files=all -- 'packages/*/tests/**/__screenshots__/**' \
            | sed 's/^...//' > "$RUNNER_TEMP/proposal/files.txt"
          cat "$RUNNER_TEMP/proposal/files.txt"
          while IFS= read -r path; do
            mkdir -p "$RUNNER_TEMP/proposal/tree/$(dirname "$path")"
            cp "$path" "$RUNNER_TEMP/proposal/tree/$path"
          done < "$RUNNER_TEMP/proposal/files.txt"
          cp "$RUNNER_TEMP/environment.txt" "$RUNNER_TEMP/proposal/"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: baselines
          path: ${{ runner.temp }}/proposal
          include-hidden-files: true

  # Holds the write token and runs no code from the repository: only git, gh
  # and pinned actions. It checks out nothing. Its git directory is a bare
  # repository of its own, with no hooks, so no git command reads configuration
  # or hooks that the recorded commit or the artifact can write, and every
  # write is a git object, never a file in a working tree.
  propose:
    needs: record
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SHA: ${{ needs.record.outputs.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: baselines
          path: ${{ runner.temp }}/proposal
      # Only regular PNG files, at baseline paths under a package's tests, enter
      # the proposal.
      - name: Accept only baseline PNG files
        run: |
          proposal="$RUNNER_TEMP/proposal"
          links="$(find "$proposal" -type l)"
          if [ -n "$links" ]; then
            printf '::error::Symbolic links in the artifact:\n%s\n' "$links"
            exit 1
          fi
          refused="$(grep -vxE 'packages/[^/]+/tests/([^/]+/)*__screenshots__/([^/]+/)*[^/]+\.png' \
            "$proposal/files.txt" || true)"
          dots="$(grep -E '(^|/)\.\.?(/|$)' "$proposal/files.txt" || true)"
          if [ -n "$refused$dots" ]; then
            printf '::error::Refused paths:\n%s\n%s\n' "$refused" "$dots" | sed '2,$s/^/  /'
            exit 1
          fi
          # PNG's eight-byte signature.
          while IFS= read -r path; do
            file="$proposal/tree/$path"
            if [ ! -f "$file" ] || [ "$(head -c 8 -- "$file" | od -An -tx1 | tr -d ' \n')" != 89504e470d0a1a0a ]; then
              echo "::error::Not a regular PNG file: $path"
              exit 1
            fi
          done < "$proposal/files.txt"
      - name: Propose
        run: |
          proposal="$RUNNER_TEMP/proposal"
          files="$proposal/files.txt"
          if [ ! -s "$files" ]; then
            echo "Every baseline matches on the runner at $SHA. Nothing was pushed or opened." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git init -q --bare --template= "$RUNNER_TEMP/repo.git"
          export GIT_DIR="$RUNNER_TEMP/repo.git" GIT_INDEX_FILE="$RUNNER_TEMP/index" GIT_LITERAL_PATHSPECS=1
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.$GITHUB_SERVER_URL/.extraheader" \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          export GIT_AUTHOR_NAME='github-actions[bot]' GIT_COMMITTER_NAME='github-actions[bot]' \
            GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com' \
            GIT_COMMITTER_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
          remote="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git fetch -q --no-tags --depth=1 "$remote" "$SHA"
          # A symbolic link in the recorded commit at any component of an
          # accepted path fails the job before the proposal is written.
          while IFS= read -r path; do
            IFS=/ read -ra parts <<< "$path"
            prefix=
            for part in "${parts[@]}"; do
              prefix="${prefix:+$prefix/}$part"
              if [ "$(git ls-tree --format='%(objectmode)' "$SHA" -- "$prefix")" = 120000 ]; then
                echo "::error::$prefix is a symbolic link at $SHA"
                exit 1
              fi
            done
          done < "$files"
          # The recorded commit's tree, with each baseline as a regular file.
          git read-tree "$SHA"
          while IFS= read -r path; do
            blob="$(git hash-object -w --no-filters -- "$proposal/tree/$path")"
            git update-index --add --cacheinfo "100644,$blob,$path"
          done < "$files"
          commit="$(git commit-tree "$(git write-tree)" -p "$SHA" -m "baselines: record on GitHub's runner at ${SHA:0:9}")"
          branch="baselines/$TARGET"
          git push -q --force "$remote" "$commit:refs/heads/$branch"
          {
            echo "Baselines recorded on GitHub's runner (\`repo:RD-13\`). Review every image before merging."
            echo
            echo "- Recorded commit: $SHA"
            echo "- Run: $RUN_URL"
            sed 's/^image=/- Runner image: /; s/^processor=/- Processor: /; s/^chromium=/- Chromium: /' \
              "$proposal/environment.txt"
            echo
            echo "Added or changed:"
            echo
            sed 's/^/- `/; s/$/`/' "$files"
          } > "$RUNNER_TEMP/body.md"
          number="$(gh pr list --head "$branch" --base "$TARGET" --state open --json number --jq '.[0].number')"
          if [ -n "$number" ]; then
            gh pr edit "$number" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --head "$branch" --base "$TARGET" \
              --title "baselines: record ${TARGET}'s visual baselines on GitHub's runner" \
              --body-file "$RUNNER_TEMP/body.md"
          fi
          # A pull request that this token opens or updates triggers no workflow,
          # so the gate is started on the proposal for `main`'s branch rule.
          if [ "$TARGET" = main ]; then
            gh workflow run verify.yml --ref "$branch"
          fi
          cat "$RUNNER_TEMP/body.md" >> "$GITHUB_STEP_SUMMARY"

  # Removes the label after every admitted labeled run, whatever `record`'s and
  # `propose`'s results, so adding it again records again. It runs no code from
  # the repository.
  unlabel:
    needs: [record, propose]
    if: >-
      always() && github.event_name == 'pull_request' && github.event.label.name == 'record-baselines' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - run: gh pr edit "$NUMBER" --remove-label record-baselines
