# Real Safari, outside the gate: weekly, and by hand on any branch, tag or
# commit (`repo:RD-12` property 12). No rule requires it, so it never blocks a
# merge. A failing scheduled run opens an issue labelled `safari`, or comments
# on the open one. A failing manual run is only its red run, which whoever
# started it reads.
name: safari

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit SHA to test. Empty means the ref the run was started on.
        required: false
        default: ''

# One run per checked-out ref at a time. A newer run waits, and none is
# cancelled.
concurrency:
  group: safari-${{ inputs.ref || github.ref }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

env:
  NODE_VERSION: 26
  # The aube that `package.json`'s `packageManager` names, installed with npm's
  # one command outside the checkout (`repo:RD-16` property 9).
  AUBE_VERSION: 2.10.0

jobs:
  # Real Safari, which runs only on macOS and only through WebDriver. Nothing
  # installs it: the runner image's Safari and its `safaridriver` run.
  safari:
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
      macos: ${{ steps.versions.outputs.macos }}
      safari: ${{ steps.versions.outputs.safari }}
      failed: ${{ steps.failed.outputs.projects }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
      - id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install aube
        id: aube
        working-directory: ${{ runner.temp }}
        run: |
          npm install -g "@endevco/aube@$AUBE_VERSION"
          echo "store=$(aube store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.aube.outputs.store }}
          key: aube-${{ runner.os }}-${{ env.AUBE_VERSION }}-${{ hashFiles('package-lock.json') }}
      - run: aube ci
      - name: Enable Safari's remote automation
        run: sudo safaridriver --enable
      # A Safari page reports the preferences a Chromium or Firefox page reports
      # by default, and the runner's user has Reduce Motion on
      # (`repo:RD-12` property 10).
      - name: Turn off Reduce Motion
        run: |
          defaults write com.apple.universalaccess reduceMotion -bool false
          value="$(defaults read com.apple.universalaccess reduceMotion)"
          echo "reduceMotion: $value"
          [ "$value" = 0 ]
      - name: macOS and Safari versions
        id: versions
        run: |
          sw_vers
          safari="$(defaults read /Applications/Safari.app/Contents/Info.plist CFBundleShortVersionString)"
          echo "$safari"
          echo "macos=$(sw_vers -productVersion) ($(sw_vers -buildVersion))" >> "$GITHUB_OUTPUT"
          echo "safari=$safari" >> "$GITHUB_OUTPUT"
      # Each Safari project in its own Vitest process (`repo:RD-12`). The
      # recipe logs `<project> exited with <status>` for each one.
      - name: Safari projects
        run: |
          set -o pipefail
          aube exec just test-safari --tags-filter '!measurement' 2>&1 | tee "$RUNNER_TEMP/safari.log"
      - name: Failed projects
        id: failed
        if: failure()
        run: |
          projects="$(sed -n 's/^\(.*\) exited with [1-9][0-9]*$/\1/p' "$RUNNER_TEMP/safari.log" 2>/dev/null | paste -sd ',' - | sed 's/,/, /g')"
          echo "projects=${projects:-none named: the job failed before a project reported its status}" >> "$GITHUB_OUTPUT"

  # Reports a failing scheduled run. It holds the workflow's only write
  # permission and runs no repository code: no checkout, no install.
  issue:
    needs: safari
    if: always() && needs.safari.result == 'failure' && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT: ${{ needs.safari.outputs.commit }}
          MACOS: ${{ needs.safari.outputs.macos }}
          SAFARI: ${{ needs.safari.outputs.safari }}
          FAILED: ${{ needs.safari.outputs.failed }}
        run: |
          body="$(printf -- '- **Run:** %s\n- **Commit:** %s\n- **macOS:** %s\n- **Safari:** %s\n- **Failed projects:** %s\n' \
            "$RUN_URL" "${COMMIT:-unknown}" "${MACOS:-unknown}" "${SAFARI:-unknown}" "${FAILED:-unknown}")"
          if ! gh label list --limit 1000 --json name --jq '.[].name' | grep -qx safari; then
            gh label create safari --description 'A failing scheduled Safari run' --color d93f0b
          fi
          number="$(gh issue list --label safari --state open --limit 1 --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --label safari --title 'The scheduled Safari run failed' --body "$body"
          fi
