# Scratch: `repo:RD-23` property 3's reading. The visual project at each swept
# threshold, twice, and once with the hover layer's opacity set to 0. Outside
# the gate; the unit removes this file.
name: state-layer-reading

on:
  push:
    branches: [repo/state-layer-visual-1]
    paths: [.github/workflows/state-layer-reading.yml]

permissions:
  contents: read

env:
  NODE_VERSION: 26
  AUBE_VERSION: 2.10.0

jobs:
  read:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        threshold: ['0.1', '0.06', '0.045', '0.03', '0.02', '0.01', '0']
        run: [a, b, hover]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install aube
        id: aube
        working-directory: ${{ runner.temp }}
        run: |
          npm install -g "@endevco/aube@$AUBE_VERSION"
          echo "store=$(aube store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.aube.outputs.store }}
          key: aube-${{ runner.os }}-${{ env.AUBE_VERSION }}-${{ hashFiles('package-lock.json') }}
      - run: aube ci
      - uses: ./.github/actions/browser
        with:
          engine: chromium
      - name: Hover layer at opacity 0
        if: matrix.run == 'hover'
        run: |
          file=packages/material-x/src/core/animations/ripple/styles/main.styles.css
          perl -0pi -e 's/(:host\(:hover\) &::before \{\n\s*opacity: )var\(--_ripple-opacity\);/${1}0;/' "$file"
          git diff --exit-code --quiet -- "$file" && { echo '::error::The mutation changed nothing'; exit 1; }
          git diff -- "$file"
      - name: Environment
        run: |
          {
            echo "image=$ImageOS $ImageVersion"
            echo "processor=$(lscpu | sed -n 's/^Model name: *//p')"
            echo "commit=$(git rev-parse HEAD)"
          } | tee "$RUNNER_TEMP/environment.txt"
      - name: Visual project
        continue-on-error: true
        run: aube exec -- just test --project visual/material-x --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/result.json"
        env:
          MX_TEST_VISUAL: '1'
          MX_VISUAL_THRESHOLD: ${{ matrix.threshold }}
      - if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cp "$RUNNER_TEMP/environment.txt" "$RUNNER_TEMP/result.json" "$RUNNER_TEMP/out/" || true
          cp -r .vitest/attachments "$RUNNER_TEMP/out/" 2>/dev/null || true
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reading-${{ matrix.threshold }}-${{ matrix.run }}
          path: ${{ runner.temp }}/out
