<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>drag2 profile — complete sortable</title>
    <!-- An empty icon, so the page makes two requests and no 404. -->
    <link rel="icon" href="data:," />
    <style>
      /*
        Deliberately plain. Nothing here animates, transitions or transforms:
        the only style work in a recording should be the library's own, so a
        rule added here has to be one the drag needs.
      */
      body {
        margin: 0;
        padding: 24px;
        font:
          14px/1.4 system-ui,
          sans-serif;
        color: #111;
        background: #fff;
      }

      h1 {
        margin: 0 0 4px;
        font-size: 16px;
      }

      p {
        margin: 0 0 20px;
        color: #555;
      }

      .list {
        margin: 0;
        padding: 0;
        list-style: none;
        width: 320px;
      }

      .item {
        box-sizing: border-box;
        height: 44px;
        padding: 0 12px;
        margin-bottom: 6px;
        display: flex;
        align-items: center;
        border: 1px solid #d0d0d0;
        border-radius: 6px;
        background: #fafafa;
        touch-action: none;
        cursor: grab;
      }
    </style>
  </head>
  <body>
    <h1>
      complete sortable —
      <code>sortable + y() + landing() + layoutAnimation()</code>
    </h1>
    <p>Press an item, drag it through a few positions, drop it.</p>

    <!--
      The rows are markup rather than a construction loop, so a recording that
      starts before load still contains no fixture DOM work — only the
      library's.
    -->
    <ul class="list" id="list">
      <li class="item">Item 1</li>
      <li class="item">Item 2</li>
      <li class="item">Item 3</li>
      <li class="item">Item 4</li>
      <li class="item">Item 5</li>
      <li class="item">Item 6</li>
      <li class="item">Item 7</li>
      <li class="item">Item 8</li>
      <li class="item">Item 9</li>
      <li class="item">Item 10</li>
      <li class="item">Item 11</li>
      <li class="item">Item 12</li>
    </ul>

    <script type="module" src="./complete.ts"></script>
  </body>
</html>
